name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-and-synthetic:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - run: bash tests/quota.sh
      - run: bash build-app.sh
