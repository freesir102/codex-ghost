name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-and-synthetic:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: bash tests/quota.sh
      - run: bash build-app.sh
